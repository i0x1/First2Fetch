name: Build macOS App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop-v tag to release
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release version and credentials
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          VERSION=$(node -p "require('./apps/desktopProbe/package.json').version")
          test "$RELEASE_TAG" = "desktop-v$VERSION" || { echo 'Tag and desktop package version differ'; exit 1; }
          for NAME in MAC_CERT MAC_CERT_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            VALUE=${!NAME}
            test -n "$VALUE" || { echo "Missing release secret: $NAME"; exit 1; }
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native DMG helper
        run: pnpm exec node-gyp rebuild --directory node_modules/macos-alias

      - name: Install signing certificate
        env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -eu
          CERT_PATH="$RUNNER_TEMP/mac-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$MAC_CERT" | base64 --decode > "$CERT_PATH"
          security create-keychain -p '' "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k '' "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p '' "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application' || { echo 'Developer ID Application certificate not found'; exit 1; }
          rm "$CERT_PATH"

      - name: Build and notarize macOS packages
        working-directory: apps/desktopProbe
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID || 'com.i0x1.first2fetch' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ secrets.AXIOM_DATASET }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY" || { echo 'Missing Supabase build secrets'; exit 1; }
          pnpm exec electron-forge make --arch x64
          pnpm exec electron-forge make --arch arm64
          codesign --verify --deep --strict 'out/First 2 Fetch-darwin-x64/First 2 Fetch.app'
          codesign --verify --deep --strict 'out/First 2 Fetch-darwin-arm64/First 2 Fetch.app'

      - name: Stage release assets
        run: |
          set -eu
          VERSION=$(node -p "require('./apps/desktopProbe/package.json').version")
          mkdir -p release-assets
          for ARCH in x64 arm64; do
            DMG="apps/desktopProbe/out/make/First 2 Fetch-${VERSION}-${ARCH}.dmg"
            ZIP="apps/desktopProbe/out/make/zip/darwin/${ARCH}/First 2 Fetch-darwin-${ARCH}-${VERSION}.zip"
            test -s "$DMG" || { echo "Missing DMG: $DMG"; exit 1; }
            test -s "$ZIP" || { echo "Missing ZIP: $ZIP"; exit 1; }
            cp "$DMG" "release-assets/first2fetch-darwin-${ARCH}-${VERSION}.dmg"
            cp "$ZIP" "release-assets/first2fetch-darwin-${ARCH}-${VERSION}.zip"
          done
          shasum -a 256 release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "First 2 Fetch ${RELEASE_TAG#desktop-v}" --generate-notes
          fi
