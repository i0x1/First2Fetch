packages:
  - apps/*
  - libraries/*

nodeLinker: hoisted
publicHoistPattern:
  - '*electron*'
  - '*@electron-forge*'
shamefullyHoist: false
sharedWorkspaceLockfile: true
enablePrePostScripts: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - aws-sdk
  - contentlayer
  - core-js
  - electron
  - electron-forge
  - electron-winstaller
  - esbuild
  - fs-xattr
  - macos-alias
  - nx
  - protobufjs
  - sharp
  - spawn-sync
  - supabase
  - unrs-resolver
